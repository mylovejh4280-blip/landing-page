<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Launchpad — 곧 출시됩니다</title>
  <meta name="description" content="새로운 서비스가 곧 출시됩니다. 대기자 명단에 등록하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12; --fg: #f4f5f7; --muted: #9aa1ad; --card: #151922;
      --line: #262b36; --accent: #6d5efc; --accent2: #22d3ee; --ok: #34d399; --err: #f87171;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: Pretendard, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--fg); min-height: 100vh;
      display: flex; flex-direction: column; overflow-x: hidden;
      background-image: radial-gradient(60rem 30rem at 50% -10%, rgba(109,94,252,.25), transparent 70%);
    }
    header, main, footer { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-top: 24px; }
    .logo { font-weight: 800; letter-spacing: -.02em; font-size: 1.15rem; }
    .logo span { color: var(--accent2); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 12vh; padding-bottom: 48px; }
    .badge { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .85rem; color: var(--muted); margin-bottom: 24px; }
    h1 { font-size: clamp(2.2rem, 7vw, 4rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
    h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { color: var(--muted); font-size: 1.1rem; margin: 20px auto 36px; max-width: 520px; line-height: 1.6; }
    form { display: flex; gap: 8px; width: 100%; max-width: 440px; }
    input { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); color: var(--fg); border-radius: 12px; padding: 14px 16px; font: inherit; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 14px 20px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
    button:disabled { opacity: .6; cursor: wait; }
    #msg { min-height: 1.5em; margin-top: 14px; font-size: .95rem; }
    #msg.ok { color: var(--ok); } #msg.err { color: var(--err); }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; width: 100%; margin-top: 80px; text-align: left; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
    .card h3 { font-size: 1.05rem; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: .95rem; line-height: 1.55; }
    footer { padding-bottom: 24px; color: var(--muted); font-size: .85rem; text-align: center; }
    @media (max-width: 480px) { form { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <div class="logo">Launch<span>pad</span></div>
  </header>

  <main>
    <div class="badge">🚀 곧 출시 예정</div>
    <h1>아이디어를 <em>더 빠르게</em><br />세상에 내놓으세요</h1>
    <p class="sub">가장 먼저 소식을 받아보세요. 이메일을 남기시면 출시 시 바로 알려드립니다.</p>

    <form id="waitlist">
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      <button type="submit" id="submit">대기자 등록</button>
    </form>
    <p id="msg" role="status"></p>

    <section class="features">
      <div class="card"><h3>⚡ 빠른 시작</h3><p>설정 없이 몇 분 만에 바로 시작할 수 있습니다.</p></div>
      <div class="card"><h3>🔒 안전한 데이터</h3><p>Supabase 기반으로 데이터를 안전하게 보관합니다.</p></div>
      <div class="card"><h3>🌍 글로벌 배포</h3><p>Vercel 엣지 네트워크로 어디서나 빠르게 로딩됩니다.</p></div>
    </section>
  </main>

  <footer>© 2026 Launchpad</footer>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";

    const supabase = createClient(
      "https://abnsblsmnqmuubcoxiwa.supabase.co",
      "sb_publishable_jPbih_yicM6F102gGNOMTg__HXov1-E"
    );

    const form = document.getElementById("waitlist");
    const btn = document.getElementById("submit");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      btn.disabled = true;
      msg.className = ""; msg.textContent = "등록 중...";
      const { error } = await supabase.from("waitlist").insert({ email });
      btn.disabled = false;
      if (error) {
        msg.className = "err";
        msg.textContent = error.code === "23505" ? "이미 등록된 이메일입니다." : "등록에 실패했습니다. 잠시 후 다시 시도해주세요.";
      } else {
        msg.className = "ok";
        msg.textContent = "등록 완료! 출시 소식을 가장 먼저 알려드릴게요 🎉";
        form.reset();
      }
    });
  </script>
</body>
</html>
